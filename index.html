<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career OS</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      * { box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
      body {
        margin: 0;
        font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, 'Noto Sans KR', sans-serif;
        background: #F7F7F5;
        color: #26251F;
        line-height: 1.5;
        /* 한글이 단어 중간에서 끊기거나 넘쳐서 깨져 보이지 않도록 */
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      ::selection { background: #E4E1D9; }
      /* 키보드 포커스에만 링 표시 (마우스 클릭 시엔 안 뜸) — 접근성 */
      :focus-visible { outline: 2px solid #63605A; outline-offset: 2px; border-radius: 4px; }
      button, input, textarea, select { font-family: inherit; }
      ::-webkit-scrollbar { width: 11px; height: 11px; }
      ::-webkit-scrollbar-thumb { background: #DEDBD3; border-radius: 8px; border: 3px solid #F7F7F5; }
      ::-webkit-scrollbar-thumb:hover { background: #cbc7bd; }
      ::-webkit-scrollbar-track { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

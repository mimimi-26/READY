<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover 가 있어야 env(safe-area-inset-*) 가 0 이 아닌 값을 준다.
         아이폰 노치·홈 인디케이터 영역을 피하는 데 쓴다.
         user-scalable=no 는 넣지 않는다 — 확대 차단은 접근성 위반이다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Career OS — 흩어진 경험을, 이력서·자소서로 바로 쓸 수 있게</title>
    <meta name="description" content="자소서·이력서 파일을 넣으면 AI가 경험을 정리하고, 지원 준비까지 한곳에서 관리합니다." />

    <!-- 아이콘. 이 태그들이 있으면 브라우저가 /favicon.ico 를 따로 요청하지 않는다.
         벡터를 먼저 두고 PNG 는 구형 폴백. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <!-- iOS 는 투명 배경을 검정으로 합성하므로 이 파일만 흰 타일이다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- 소셜 미리보기. og:image 는 반드시 절대 URL 이어야 한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Career OS" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://ready-sepia.vercel.app/" />
    <meta property="og:title" content="Career OS — 흩어진 경험을, 이력서·자소서로 바로 쓸 수 있게" />
    <meta property="og:description" content="자소서·이력서 파일을 넣으면 AI가 경험을 정리하고, 지원 준비까지 한곳에서 관리합니다." />
    <meta property="og:image" content="https://ready-sepia.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Career OS" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Career OS — 흩어진 경험을, 이력서·자소서로 바로 쓸 수 있게" />
    <meta name="twitter:description" content="자소서·이력서 파일을 넣으면 AI가 경험을 정리하고, 지원 준비까지 한곳에서 관리합니다." />
    <meta name="twitter:image" content="https://ready-sepia.vercel.app/og.png" />
    <link
      rel="stylesheet"
      href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css"
    />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Spoqa Han Sans Neo', 'Spoqa Han Sans JP', -apple-system, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

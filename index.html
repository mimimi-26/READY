    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

      body { margin: 0; font-family: 'Spoqa Han Sans Neo', 'Spoqa Han Sans JP', -apple-system, sans-serif; }
    </style>
  </head>
